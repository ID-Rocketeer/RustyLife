[package]
name = "rustylife-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5.60", features = ["derive"] }
crc32fast = "1.3"
crossbeam-channel = "0.5.15"
crossbeam-deque = "0.8.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ts-rs = "12.0.1"

[dev-dependencies]
tempfile = "3.8"
tokio = { version = "1.0", features = ["full"] }
criterion = "0.5"

[[bench]]
name = "simd_bench"
harness = false
