<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web GUI Test Harness</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }

        .controls {
            margin-bottom: 20px;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #00ff00;
        }

        button {
            margin: 5px;
            padding: 10px;
            background: #00ff00;
            color: #000;
            border: none;
            cursor: pointer;
            font-family: monospace;
        }

        button:hover {
            background: #00cc00;
        }

        #log {
            background: #000;
            padding: 10px;
            border: 1px solid #00ff00;
            height: 400px;
            overflow-y: auto;
            font-size: 12px;
        }

        .log-entry {
            margin: 2px 0;
        }

        .log-send {
            color: #ffff00;
        }

        .log-recv {
            color: #00ffff;
        }

        .log-error {
            color: #ff0000;
        }
    </style>
</head>

<body>
    <h1>RustyLife Web GUI Test Harness</h1>

    <div class="controls">
        <h3>Mock Server Controls</h3>
        <button onclick="startMockServer('./index.html')">Start Mock Server (Main GUI)</button>
        <button onclick="startMockServer('./telemetry.html')">Start Mock Server (Telemetry)</button>
        <button onclick="stopMockServer()">Stop Mock Server</button>
        <br>
        <button onclick="sendWelcome()">Send Welcome</button>
        <button onclick="sendBinaryState(1, 5)">Send BinaryStateHeader (gen=1, 5 cells)</button>
        <button onclick="sendError('Test error message')">Send Error</button>
        <br>
        <button onclick="simulatePatternLoad()">Simulate: Pattern Load</button>
        <button onclick="simulateRunning()">Simulate: Running Engine</button>
        <button onclick="simulateStop()">Simulate: Stop Engine</button>
    </div>

    <div id="log"></div>

    <script type="module">
        import { encodeRequest } from './protocol.js';

        window.mockWs = null;
        let mockServer = null;

        window.log = function (message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        };

        window.startMockServer = async function (targetHtml = './index.html') {
            log(`Starting mock WebSocket server for ${targetHtml}...`, 'send');

            // Clear any existing iframes
            const existingIframes = document.querySelectorAll('iframe');
            existingIframes.forEach(iframe => iframe.remove());

            // Use fetch to grab the target html so we can inject MockWebSocket BEFORE its scripts run
            fetch(targetHtml).then(r => r.text()).then(indexHtml => {
                const iframe = document.createElement('iframe');
                iframe.style.width = '1000px';
                iframe.style.height = '800px';
                iframe.style.border = '2px solid #00ff00';

                // Add base href so relative paths like dashboard.js work
                let injectedHtml = indexHtml.replace('<head>', '<head>\n<base href="' + window.location.href + '">');

                // Define the mock WebSocket class
                const mockScript = `
                <script>
                    window.MockWebSocketClass = class MockWebSocket extends EventTarget {
                        constructor(url) {
                            super();
                            window.parent.log(\`Mock WebSocket connecting to: \${url}\`, 'recv');
                            this.url = url;
                            this.readyState = 0; // CONNECTING
                            this.binaryType = 'arraybuffer';
                            
                            setTimeout(() => {
                                this.readyState = 1; // OPEN
                                if (this.onopen) this.onopen({ type: 'open' });
                                window.parent.log('Mock WebSocket connected', 'recv');
                            }, 100);

                            window.parent.mockWs = this;
                        }

                        send(data) {
                            window.parent.log(\`GUI sent: \${data.byteLength || data.length} bytes\`, 'send');
                            try {
                                const buffer = data.buffer ? data.buffer : data;
                                const view = new DataView(buffer);
                                const jsonLen = view.getUint32(0, true);
                                const jsonBytes = new Uint8Array(buffer, 4, jsonLen);
                                const jsonStr = new TextDecoder().decode(jsonBytes);
                                const request = JSON.parse(jsonStr);
                                window.parent.log(\`  Request: \${JSON.stringify(request)}\`, 'send');

                                if (request.type === "HandshakeFullSnapshot") {
                                    window.parent.simClientType = "FullSnapshot";
                                    setTimeout(() => {
                                        window.parent.sendBinaryState(window.parent.simGen || 0, 10);
                                    }, 1);
                                } else if (request.type === "HandshakeMetricsOnly") {
                                    window.parent.simClientType = "MetricsOnly";
                                    setTimeout(() => {
                                        window.parent.sendSnapshotAvailable(window.parent.simGen || 0, 10);
                                    }, 1);
                                } else if (request.type === "AckPreviousFrame") {
                                    if (window.parent.simIsRunning) {
                                        setTimeout(() => {
                                            window.parent.simGen = (window.parent.simGen || 0) + 1;
                                            if (window.parent.simClientType === "MetricsOnly") {
                                                window.parent.sendSnapshotAvailable(window.parent.simGen, 10);
                                            } else {
                                                window.parent.sendBinaryState(window.parent.simGen, 10);
                                            }
                                        }, 16);
                                    }
                                } else if (request.type === "UpdateViewport") {
                                    setTimeout(() => {
                                        if (window.parent.simClientType === "MetricsOnly") {
                                            window.parent.sendSnapshotAvailable(window.parent.simGen || 0, 10);
                                        } else {
                                            window.parent.sendBinaryState(window.parent.simGen || 0, 10);
                                        }
                                    }, 1);
                                }
                            } catch (e) {
                                window.parent.log(\`  Failed to parse request: \${e}\`, 'error');
                            }
                        }

                        close() {
                            this.readyState = 3; // CLOSED
                            if (this.onclose) this.onclose({ type: 'close' });
                            window.parent.log('Mock WebSocket closed', 'recv');
                        }
                    };
                    window.MockWebSocketClass.CONNECTING = 0;
                    window.MockWebSocketClass.OPEN = 1;
                    window.MockWebSocketClass.CLOSING = 2;
                    window.MockWebSocketClass.CLOSED = 3;
                    window.WebSocket = window.MockWebSocketClass;
                    window.parent.log('Mock WebSocket injected successfully', 'recv');
                <\/script>`;

                // Inject the mock script right before </body> or inside <head>
                injectedHtml = injectedHtml.replace('<head>', '<head>' + mockScript);

                iframe.srcdoc = injectedHtml;
                document.body.appendChild(iframe);

                // Add a small delay for the iframe to mount before slamming the socket with a Welcome
                setTimeout(() => {
                    if (window.simulatePatternLoad) {
                        window.simulatePatternLoad();
                    }
                }, 500);
            });
        };


        window.stopMockServer = function () {
            if (window.mockWs) {
                window.mockWs.close();
                window.mockWs = null;
            }
            log('Mock server stopped', 'send');
        };

        window.sendWelcome = function () {
            if (!window.mockWs) {
                log('Mock server not started!', 'error');
                return;
            }

            const response = {
                type: 'Welcome',
                payload: {
                    cores: 13,
                    patterns: [
                        { name: 'Blinker', description: 'Test pattern' },
                        { name: 'Glider', description: 'Test pattern 2' }
                    ],
                    palette: {
                        classic: [255, 255, 255],
                        bi_state: [
                            [0, 0, 255],
                            [0, 255, 0],
                            [255, 0, 0]
                        ],
                        tri_state: [
                            [255, 0, 0],
                            [255, 0, 128],
                            [255, 0, 255],
                            [0, 255, 0],
                            [0, 255, 128],
                            [0, 255, 255],
                            [0, 0, 255]
                        ]
                    }
                }
            };

            const json = JSON.stringify(response);
            const jsonBytes = new TextEncoder().encode(json);
            const len = jsonBytes.length;

            const buf = new ArrayBuffer(4 + len);
            const view = new DataView(buf);
            view.setUint32(0, len, true);
            new Uint8Array(buf, 4).set(jsonBytes);

            if (window.mockWs.onmessage) {
                window.mockWs.onmessage({ data: buf });
                log(`Sent Welcome (${len} bytes)`, 'recv');
            }
        };

        window.sendSnapshotAvailable = function (generation, population) {
            if (!window.mockWs) {
                log('Mock server not started!', 'error');
                return;
            }

            const response = {
                type: 'SnapshotAvailable',
                payload: {
                    generation: generation,
                    telemetry: {
                        timestamp: Date.now(),
                        population: population,
                        is_running: true,
                        gps: 1000.0,
                        work_rate: 50.0,
                        net_rate: 10.0,
                        bounds: [[0, 0], [10, 10]]
                    }
                }
            };

            const json = JSON.stringify(response);
            const jsonBytes = new TextEncoder().encode(json);
            const len = jsonBytes.length;

            const buf = new ArrayBuffer(4 + len);
            const view = new DataView(buf);
            view.setUint32(0, len, true);
            new Uint8Array(buf, 4).set(jsonBytes);

            if (window.mockWs.onmessage) {
                window.mockWs.onmessage({ data: buf });
                log(`Sent SnapshotAvailable gen=${generation} pop=${population}`, 'recv');
            }
        };

        window.sendBinaryState = function (generation, cellCount) {
            if (!window.mockWs) {
                log('Mock server not started!', 'error');
                return;
            }

            const header = {
                type: 'BinaryStateHeader',
                payload: {
                    telemetry: {
                        generation: generation,
                        population: cellCount,
                        is_running: window.simIsRunning || false,
                        gps: window.simIsRunning ? 1000.0 : 0.0,
                        work_rate: window.simIsRunning ? 50.0 : 0.0,
                        net_rate: 10.0,
                        bounds: [[0, 0], [10, 10]]
                    },
                    record_count: cellCount
                }
            };

            const json = JSON.stringify(header);
            const jsonBytes = new TextEncoder().encode(json);
            const jsonLen = jsonBytes.length;

            const binarySize = cellCount * 33;
            const totalSize = 4 + jsonLen + binarySize;

            const buf = new ArrayBuffer(totalSize);
            const view = new DataView(buf);

            view.setUint32(0, jsonLen, true);
            new Uint8Array(buf, 4).set(jsonBytes);

            let offset = 4 + jsonLen;
            for (let i = 0; i < cellCount; i++) {
                view.setBigInt64(offset, BigInt(i), true);
                view.setBigInt64(offset + 8, 0n, true);
                offset += 16;
                view.setBigInt64(offset, 0n, true);
                view.setBigInt64(offset + 8, 0n, true);
                offset += 16;
                view.setUint8(offset, 1);
                offset += 1;
            }

            if (window.mockWs.onmessage) {
                window.mockWs.onmessage({ data: buf });
                log(`Sent BinaryStateHeader gen=${generation} cells=${cellCount}`, 'recv');
            }
        };

        window.sendError = function (message) {
            if (!window.mockWs) {
                log('Mock server not started!', 'error');
                return;
            }

            const response = {
                type: 'Error',
                payload: message
            };

            const json = JSON.stringify(response);
            const jsonBytes = new TextEncoder().encode(json);
            const len = jsonBytes.length;

            const buf = new ArrayBuffer(4 + len);
            const view = new DataView(buf);
            view.setUint32(0, len, true);
            new Uint8Array(buf, 4).set(jsonBytes);

            if (window.mockWs.onmessage) {
                window.mockWs.onmessage({ data: buf });
                log(`Sent Error: ${message}`, 'recv');
            }
        };

        window.simulatePatternLoad = function () {
            log('=== Simulating Pattern Load ===', 'send');
            window.simIsRunning = false;
            window.simGen = 0;
            sendWelcome();
        };

        window.simulateRunning = function () {
            log('=== Simulating Running Engine ===', 'send');
            window.simIsRunning = true;
            setTimeout(() => {
                window.simGen = (window.simGen || 0) + 1;
                if (window.simClientType === "MetricsOnly") {
                    window.sendSnapshotAvailable(window.simGen, 10);
                } else {
                    window.sendBinaryState(window.simGen, 10);
                }
            }, 10);
        };

        window.simulateStop = function () {
            log('=== Simulating Stop Engine ===', 'send');
            window.simIsRunning = false;
            if (window.simClientType === "MetricsOnly") {
                window.sendSnapshotAvailable(window.simGen || 0, 10);
            } else {
                window.sendBinaryState(window.simGen || 0, 10);
            }
        };

        // Auto-start disabled to prevent state corruption when switching between GUI and Telemetry testing
        // Users must click "Start Mock Server..." to begin.
    </script>
</body>

</html>
