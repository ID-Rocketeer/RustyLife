<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RustyLife Dashboard</title>
    <style>
        :root {
            --primary: #3b82f6;
            --bg: #000000;
            --card-bg: #111827;
            --text: #f9fafb;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* Canvas will resize to container */
            height: 100vh;
            width: 100vw;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 0.5rem;
            /* Reduced from 1rem */
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0 0 0.5rem 0;
            text-align: center;
            background: linear-gradient(to right, #3b82f6, #10b981);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-controls {
            display: grid;
            grid-template-columns: minmax(150px, 1fr) auto minmax(150px, 1fr);
            align-items: center;
            margin-bottom: 0.5rem;
            gap: 1rem;
            width: 100%;
        }

        .header-controls>div:first-child {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .generation-info,
        .population-info {
            font-size: 0.875rem;
            font-weight: 600;
            color: #9ca3af;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .population-info {
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #generation,
        #count {
            color: var(--text);
            font-weight: 800;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        button {
            background: #374151;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover:not(:disabled) {
            background: #4b5563;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.primary {
            background: #3b82f6;
        }

        button.primary:hover:not(:disabled) {
            background: #2563eb;
        }

        button.selected {
            background: var(--primary);
        }

        button.selected:hover:not(:disabled) {
            background: #2563eb;
        }

        button.danger {
            background: #991b1b;
        }

        button.danger:hover:not(:disabled) {
            background: #b91c1c;
        }

        select {
            background: #374151;
            color: white;
            border: none;
            padding: 0.5rem;
            border-radius: 0.375rem;
            font-weight: 600;
            font-size: 0.875rem;
        }

        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .canvas-container {
            flex: 1;
            background: #000000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            overflow: hidden;
            width: 100%;
            display: flex;
            /* Ensures canvas fills container if treated as flex item */
        }

        canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .footer-container {
            display: flex;
            flex-direction: column;
            gap: 1px;
            /* Reduced from 2px */
            margin-top: 0.25rem;
            /* Add top margin for separation from canvas */
        }

        .footer-status {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            font-size: 0.75rem;
            color: #9ca3af;
            background: rgba(0, 0, 0, 0.4);
            padding: 1px 8px;
            /* Reduced from 2px 8px */
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-weight: 500;
            gap: 1.5rem;
            overflow-x: auto;
            flex-wrap: nowrap;
            /* Force internal elements to stay in one row */
            /* Allow footer to scroll if window too narrow */
        }

        .instrument-segment {
            display: flex;
            align-items: center;
            gap: 0px;
            flex-shrink: 0;
            /* Keep telemetry from being squashed */
        }

        .instrument-label {
            color: #6b7280;
            font-weight: 800;
            font-size: 0.65rem;
            letter-spacing: 0.05em;
            cursor: help;
            border-bottom: 1px dotted #4b5563;
            /* padding-right removed for tightness */
        }

        .instrument-data {
            font-family: 'JetBrains Mono', 'Menlo', 'Monaco', 'Courier New', monospace;
            font-variant-numeric: tabular-nums;
            color: #10b981;
            /* Laboratory Green */
            background: rgba(0, 0, 0, 0.5);
            padding: 0px 0;
            border-radius: 2px;
            letter-spacing: -0.02em;
            display: inline-block;
            text-align: left;
            /* Changed from center to left to keep bracket close to label */
            /* padding-left removed for tightness */
            white-space: nowrap;
        }

        /* Specific widths to keep labels attached to data */
        /* Adjusted widths based on left-align and content */
        /* REMOVED: min-widths caused inconsistent visual spacing with flex-gap */

        .connection-status {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            min-width: 120px;
            margin-left: auto;
            /* Push to the right */
        }

        .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ef4444;
            margin-right: 0.25rem;
        }

        .dot.connected {
            background: #10b981;
            box-shadow: 0 0 5px #10b981;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header-controls">
            <div>
                <h1>RustyLife</h1>
                <div class="generation-info">Gen: <span id="generation">0</span></div>
            </div>

            <div class="controls">
                <div class="controls-group">
                    <button id="play-pause-btn" title="Play-Pause" class="primary-btn">⏸</button>
                    <button id="step-btn" title="Single-Step">⏯</button>
                    <button id="reset-btn" title="Reset">⏮</button>
                </div>
                <button id="origin-btn" title="Return to Origin (0,0)">Origin</button>
                <select id="pattern-select">
                    <option value="" disabled selected>Select Pattern...</option>
                </select>
                <button id="color-mode-btn" title="Toggle between 4-Color and B&W modes">Classic</button>
                <button id="zoom-in-btn">In</button>
                <button id="zoom-out-btn">Out</button>
            </div>

            <div style="display: flex; align-items: center; justify-content: flex-end; gap: 1rem;">
                <div class="population-info">
                    <span>Population:</span>
                    <span id="count">0</span>
                </div>
                <button id="quit-btn" class="danger" title="Shuts down the simulation server">Quit</button>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="sim-canvas"></canvas>
        </div>

        <div class="footer-container">
            <div class="footer-status">
                <!-- Row 1: Primary Metrics -->
                <div class="instrument-segment">
                    <span class="instrument-label" title="{{TOOLTIP_ZOOM}}">ZOOM:</span>
                    <span id="zoom-display" class="instrument-data">[ 04.00X ]</span>
                </div>

                <div class="instrument-segment">
                    <span class="instrument-label" title="{{TOOLTIP_EXTENT}}">EXTENT:</span>
                    <span id="extent-display" class="instrument-data">[ 00000 &times; 00000 ]</span>
                </div>

                <div class="instrument-segment">
                    <span class="instrument-label" title="{{TOOLTIP_CENTER}}">CENTER:</span>
                    <span id="center-display" class="instrument-data">[ +000000000 , +000000000 ]</span>
                </div>

                <div class="instrument-segment">
                    <span class="instrument-label" title="{{TOOLTIP_WORK}}">WORK:</span>
                    <span id="work-display" class="instrument-data">[ 000.00 /S ]</span>
                </div>

                <div class="instrument-segment">
                    <span class="instrument-label" title="{{TOOLTIP_NET}}">NET:</span>
                    <span id="net-display" class="instrument-data">[ +000.00 /S ]</span>
                </div>

                <div class="instrument-segment">
                    <span class="instrument-label" title="{{TOOLTIP_GPS}}">GPS:</span>
                    <span id="gps-display" class="instrument-data">[ 000.00 &nbsp;/S ]</span>
                </div>

                <div class="instrument-segment">
                    <span class="instrument-label" title="{{TOOLTIP_CORES}}">CORES:</span>
                    <span id="cores-display" class="instrument-data">[ 00 ]</span>
                </div>
            </div>

            <!-- Row 2: Bounds, Expanse, Connection Status -->
            <div class="footer-status">
                <div class="instrument-segment">
                    <span class="instrument-label" title="Bounding box of all living cells">BOUNDS:</span>
                    <span id="bounds-display" class="instrument-data">[ (+000000000, +000000000) → (+000000000,
                        +000000000) ]</span>
                </div>

                <div class="instrument-segment">
                    <span class="instrument-label" title="Width x Height of the bounding box">EXPANSE:</span>
                    <span id="expanse-display" class="instrument-data">[ 000000000 × 000000000 ]</span>
                </div>

                <div class="connection-status">
                    <span id="status-dot" class="dot"></span>
                    <span id="status-text">Disconnected</span>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="dashboard.js?v=4"></script>
</body>

</html>
