[package]
name = "rustylife-server"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
rustylife-core = { path = "../rustylife-core" }
rustylife-gui = { path = "../rustylife-gui" }
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
anyhow = "1.0"
egui = "0.29.1"
eframe = "0.29.1"
crc32fast = "1.5.0"
serde_json = "1.0.149"
chrono = "0.4"
# Removed interprocess

[dev-dependencies]
futures-util = "0.3.31"
tempfile = "3.3"
tokio-tungstenite = "0.28.0"
url = "2.5.8"
