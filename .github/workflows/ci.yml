name: CI

on:
  push:
    branches: [ "main", "experiment/*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Install System Dependencies (Linux GUI)
      run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgtk-3-dev

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'
        cache-dependency-path: './rustylife-server/package-lock.json'

    - name: Check Code Formatting
      run: cargo fmt -- --check

    - name: Run Clippy Linter
      run: cargo clippy -- -D warnings

    - name: Run Rust Engine Tests
      run: cargo test

    - name: Run Web GUI Tests
      working-directory: ./rustylife-server
      run: |
        npm ci
        npm test
